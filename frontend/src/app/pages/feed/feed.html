<div class="flex h-screen bg-gray-50 font-sans text-gray-800 overflow-hidden">
  
  <!-- USAMOS EL COMPONENTE SIDEBAR -->
  <!-- 'hidden md:flex' asegura que se oculte en móviles y se vea en pantallas medianas+ -->
  <div class="hidden md:flex h-full">
    <app-sidebar></app-sidebar>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden bg-white">
    
    <!-- Header Móvil (Solo visible en pantallas pequeñas) -->
    <header class="h-16 border-b border-gray-100 flex items-center justify-between px-6 bg-white md:hidden flex-shrink-0">
       <span class="font-bold text-gray-800">ConectaVoluntarios</span>
       <button class="text-gray-500">☰</button>
    </header>

    <div class="flex-1 overflow-y-auto p-6 md:p-10 bg-white">
      <div class="max-w-6xl mx-auto">
        
        <!-- Título -->
        <h1 class="text-2xl font-bold text-gray-900">Buscar Oportunidades de Voluntariado</h1>
        <p class="text-gray-500 mt-1 mb-8">Encuentra eventos que coincidan con tus intereses y disponibilidad</p>

        <!-- Barra de Búsqueda y Filtros -->
        <div class="flex gap-4 mb-6">
           <div class="relative flex-1">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </span>
              <input [(ngModel)]="searchTerm" type="text" placeholder="Buscar por título u organización..." 
                     class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg leading-5 bg-gray-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-teal-500 focus:border-teal-500 sm:text-sm transition-colors">
           </div>
           <button class="flex items-center gap-2 bg-white border border-gray-200 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-50 shadow-sm transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
              Filtros
           </button>
        </div>

        <!-- Badge Resultados -->
        <div class="mb-8">
           <span class="bg-orange-400 text-white text-xs font-bold px-3 py-1 rounded-full">
             {{ filteredEvents.length }} eventos encontrados
           </span>
        </div>

        <!-- Grid Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
           <div *ngFor="let event of filteredEvents" class="bg-white rounded-2xl border border-gray-200 overflow-hidden hover:shadow-lg transition-all group flex flex-col">
              <!-- Imagen -->
              <div class="h-48 bg-gray-200 relative overflow-hidden">
                 <div *ngIf="!event.image_url" class="w-full h-full flex items-center justify-center bg-gray-300 text-gray-500">
                    <span class="text-4xl">📷</span>
                 </div>
                 <img *ngIf="event.image_url" [src]="event.image_url" class="w-full h-full object-cover">
                 <span class="absolute top-3 right-3 bg-white/90 backdrop-blur text-gray-800 text-xs font-bold px-2 py-1 rounded shadow-sm">
                    {{ event.category }}
                 </span>
              </div>

              <!-- Contenido -->
              <div class="p-5 flex-1 flex flex-col">
                 <h3 class="font-bold text-gray-900 text-lg mb-1">{{ event.title }}</h3>
                 <p class="text-gray-500 text-sm mb-4">{{ event.organizer.full_name }}</p>
                 
                 <div class="mt-auto space-y-2 text-sm text-gray-600">
                    <div class="flex items-center gap-2">
                       <span>📅</span> {{ event.event_date }}
                    </div>
                    <div class="flex items-center gap-2">
                       <span class="truncate">📍 {{ event.location }}</span>
                    </div>
                 </div>
              </div>

              <!-- Botón -->
              <div class="px-5 pb-5">
                 <button class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-lg transition-colors shadow-sm">
                    Ver Detalles
                 </button>
              </div>
           </div>
        </div>

      </div>
    </div>
  </main>
</div>
