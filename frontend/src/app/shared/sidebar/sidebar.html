<aside class="w-64 bg-white border-r border-gray-200 h-full flex flex-col">
  <!-- Logo -->
  <div class="h-16 flex items-center px-6 border-b border-gray-100 flex-shrink-0">
    <span class="text-teal-600 text-2xl mr-2">♻️</span>
    <span class="font-bold text-gray-800 text-lg">ConectaVoluntarios</span>
  </div>

  <!-- Menú -->
  <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
    
    <!-- DASHBOARD -->
    <a routerLink="/dashboard/volunteer" 
       routerLinkActive="bg-teal-50 text-teal-700 font-bold border-l-4 border-teal-600"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-all">
       <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
       Dashboard
    </a>

    <!-- BUSCAR EVENTOS -->
    <a routerLink="/feed" 
       routerLinkActive="bg-orange-400 text-white shadow-md font-bold"
       class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-all">
       <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
       Buscar Eventos
    </a>

    <!-- MI HISTORIAL (Ejemplo inactivo) -->
    <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
       <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
       Mi Historial
    </a>
  </nav>

  <!-- Usuario / Salir -->
  <div class="p-4 border-t border-gray-100 mt-auto">
    <div class="flex items-center gap-3 mb-4 px-2">
       <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold">
          {{ authService.currentUser()?.full_name?.charAt(0) }}
       </div>
       <div class="overflow-hidden">
          <p class="text-sm font-bold truncate">{{ authService.currentUser()?.full_name }}</p>
          <p class="text-xs text-gray-500 capitalize">{{ authService.currentUser()?.role }}</p>
       </div>
    </div>
    <button (click)="authService.logout()" class="flex items-center gap-2 text-gray-500 hover:text-red-600 w-full px-2 py-1 text-sm font-medium transition-colors">
       <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
       Cerrar Sesión
    </button>
  </div>
</aside>
